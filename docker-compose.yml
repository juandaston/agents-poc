version: "3.8"

services:
  api:
    build: .
    container_name: finance-agent-api
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # Live mount from siigo-api (local dev). If missing/empty, image uses /app/semantic.
      - SEMANTIC_CATALOG_DIR=/app/semantic-live
    volumes:
      - ../siigo-api/core/semantic:/app/semantic-live:ro
    restart: always

# Capa semántica Valia — fuente de verdad para agentes, analytics y tableros.
# Consumidores: agents-poc (text-to-SQL), core/analytics (allowlist gold).
version: 1

primary_entity: vw_fact_bdp_enriched
kpi_entity: vw_kpis_financiero
gold_schema: gold

global_rules:
  - Filtra SIEMPRE por customer_id en tablas silver y vistas gold.
  - PREFERIR gold.vw_fact_bdp_enriched para montos contables (mvto, saldos), P&L y tableros de Estado de Resultados (fact_bdp + rubros ya unidos).
  - En vw_fact_bdp_enriched: nombre_rubro_grupo para totales de línea KPI amplia; nombre_cuenta / sub_nodo_s3 / nombre_auxiliar para conceptos específicos (ej. seguros dentro de Gasto Admon).
  - Agregar montos con SUM(mvto) — NUNCA ABS(mvto) ni SUM(ABS(mvto)); mvto ya tiene signo contable correcto.
  - En TODA consulta a vw_fact_bdp_enriched filtrar uso = 'ER' (Estado de Resultados). Por ahora excluir uso = 'BG' (Balance General).
  - Si piden varios conceptos, verificar primero cada uno con DISTINCT en vw_dim_accounts para obtener campo y valor exactos; luego consultar cada uno en un SELECT independiente con etiqueta concepto y SUM(mvto), unidos con UNION ALL. Nunca devolver un único SUM de filtros combinados con OR ni inventar el nivel jerárquico.
  - Ventas / facturación / ingresos operacionales → vw_fact_bdp_enriched con nombre_rubro_grupo = 'Ingresos Operacionales' (no vw_ventas_netas_mes).
  - Devoluciones / notas crédito → vw_fact_bdp_enriched con nombre_cuenta/nombre_auxiliar ILIKE '%devoluc%' (NO fact_nota_credito).
  - PREFERIR gold.vw_dim_accounts SOLO para catálogo de cuentas / jerarquía SIN montos (no tiene mvto ni saldo).
  - PREFERIR gold.vw_kpis_financiero SOLO para ratios pre-calculados (ROE, ROA, liquidez, endeudamiento) cuando la pregunta lo pida explícitamente.
  - PREFERIR gold.vw_fact_bdp_enriched para ventas/facturación/ingresos operacionales (nombre_rubro_grupo = 'Ingresos Operacionales'; alineado con tablero Power BI).
  - vw_ventas_netas_mes solo si se pide explícitamente detalle facturación Siigo (bruto − notas crédito) distinto al tablero contable.
  - PREFERIR gold.vw_ventas_por_producto_mes para mix, top productos y ventas por producto.
  - PREFERIR gold.vw_presupuesto_vs_real_mes para presupuesto vs real, cumplimiento y variación.
  - PREFERIR gold.vw_semaforos_cliente para semáforos del periodo más reciente.
  - PREFERIR gold.vw_ultimo_periodo_cliente para saber el último mes/fecha con datos.
  - dim_customers.customer_id es varchar (id negocio), NO confundir con uuid customer_id de hechos.
  - fact_bdp.id_tiempo referencia gold.dim_time(id_time) — SOLO fact_bdp tiene id_tiempo.
  - fact_venta: filtrar fechas SOLO con columnas de la tabla (invoice_date, load_ts). NO JOIN gold.dim_time_sales ni gold.dim_time.
  - fact_venta incluye fila fallback cuando la factura no trae ítems (product_name = Sin detalle de ítems).
  - EXTRACT filtra Siigo por created_start/created_end (creación del documento); SILVER/ANALYTICS usan invoice_date / credit_note_date (elaboración). No mezclar criterios en comparaciones mensuales.
  - presupuesto_proyeccion.anio_mes formato YYYY-MM; siempre deleted_at IS NULL.
  - Preferir tablas productivas; test_* solo en entornos de prueba.
  - Consultar SIEMPRE primero la vista gold enrutada; si no hay filas, reintentar con silver_fallback del catálogo.

entities:
  vw_dim_accounts:
    route_key: vw_dim_accounts
    qualified_name: gold.vw_dim_accounts
    layer: gold
    kind: view
    description: Catálogo plan de cuentas + rubros/nodos por cliente (sin montos; solo estructura)
    prefer_for: [plan contable, catálogo cuentas, jerarquía contable, rubros, nodos, auxiliar, subcuenta]
    customer_filter: customer_id
    grain: [customer_id, id_auxiliar]
    silver_fallback: [dim_accounts]
    metrics:
      jerarquia: [id_auxiliar, nombre_auxiliar, id_subcuenta, nombre_subcuenta, id_cuenta, nombre_cuenta, id_grupo, nombre_grupo, id_clase, nombre_clase]
      rubros: [id_rubro, nombre_rubro_grupo, nombre_rubro_clase, uso, nodo_s1, nodo_s2, sub_nodo_s3, cod_nodo]

  vw_fact_bdp_enriched:
    route_key: vw_fact_bdp_enriched
    qualified_name: gold.vw_fact_bdp_enriched
    layer: gold
    kind: view
    description: BDP enriquecido — movimientos/saldos + rubros tablero (misma lógica Power BI dim+fact)
    prefer_for: [tablero, ingresos, utilidad, costos, gastos, margen, balance, movimientos, saldo, mvto, estado de resultados]
    customer_filter: customer_id
    time_columns: [anio_mes, anio, fecha, source_date, mes_corto]
    grain: [customer_id, id_auxiliar, id_tiempo]
    silver_fallback: []
    metrics:
      montos: [mvto, saldo_inicial, saldo_final, movimiento_debito, movimiento_credito]
      rubros: [nombre_rubro_grupo, nombre_rubro_clase, nodo_s1, nodo_s2, sub_nodo_s3, cod_nodo, uso]
      tiempo: [anio_mes, anio, mes_corto, trimestre, fecha, source_date]

  vw_kpis_financiero:
    route_key: vw_kpis_financiero
    qualified_name: gold.vw_kpis_financiero
    layer: gold
    kind: view
    description: KPIs financieros pre-calculados (balance, P&L, ratios, semáforos)
    prefer_for: [kpis, margen, utilidad, roe, roa, liquidez, endeudamiento, semaforo]
    customer_filter: customer_id
    time_columns: [anio, anio_mes, mes_corto]
    grain: [customer_id, anio_mes]
    silver_fallback: [fact_bdp]
    metrics:
      balance: [activo_corriente, activo_no_corriente, activo_total, pasivo_corriente, pasivo_no_corriente, pasivo_total, patrimonio_total]
      resultados: [ingresos_operacionales, costo_ventas_total, utilidad_bruta, utilidad_operacional, utilidad_neta]
      ratios: [razon_corriente, pct_margen_bruto, pct_margen_neto, pct_roe, pct_roa, apalancamiento]
      semaforos: [semaforo_liquidez, semaforo_endeudamiento, semaforo_margen_bruto, semaforo_utilidad_neta]

  vw_ventas_netas_mes:
    route_key: vw_ventas_netas_mes
    qualified_name: gold.vw_ventas_netas_mes
    layer: gold
    kind: view
    description: ventas brutas y netas mensuales (facturación − notas crédito)
    prefer_for: [ventas netas, ventas brutas, facturacion neta, notas credito, devoluciones]
    customer_filter: customer_id
    time_columns: [anio_mes]
    grain: [customer_id, anio_mes]
    silver_fallback: [fact_venta, fact_nota_credito]
    metrics:
      ventas: [ventas_brutas, notas_credito, ventas_netas]

  vw_ventas_por_producto_mes:
    route_key: vw_ventas_por_producto_mes
    qualified_name: gold.vw_ventas_por_producto_mes
    layer: gold
    kind: view
    description: ventas agregadas por producto y mes (mix, top productos)
    prefer_for: [producto, mix, top ventas, ventas por producto]
    customer_filter: customer_id
    time_columns: [anio_mes]
    grain: [customer_id, anio_mes, product_name]
    silver_fallback: [fact_venta]
    metrics:
      ventas: [total_ventas, cantidad, num_facturas]

  vw_presupuesto_vs_real_mes:
    route_key: vw_presupuesto_vs_real_mes
    qualified_name: gold.vw_presupuesto_vs_real_mes
    layer: gold
    kind: view
    description: presupuesto vs saldo real por cuenta y mes
    prefer_for: [presupuesto vs real, cumplimiento, variacion presupuesto, ejecucion presupuesto]
    customer_filter: customer_id
    time_columns: [anio_mes]
    grain: [customer_id, anio_mes, cuenta_contable]
    silver_fallback: [presupuesto_proyeccion, fact_bdp]
    metrics:
      presupuesto: [presupuesto, real_saldo, variacion, pct_cumplimiento]
      rubros: [nombre_rubro_grupo, nombre_rubro_clase, nodo_s1, nodo_s2, sub_nodo_s3, cod_nodo, uso]

  vw_semaforos_cliente:
    route_key: vw_semaforos_cliente
    qualified_name: gold.vw_semaforos_cliente
    layer: gold
    kind: view
    description: semáforos y ratios del último mes KPI por cliente
    prefer_for: [semaforo actual, alertas financieras, estado semaforos]
    customer_filter: customer_id
    time_columns: [anio_mes]
    grain: [customer_id]
    silver_fallback: [fact_bdp]
    metrics:
      semaforos: [semaforo_liquidez, semaforo_endeudamiento, semaforo_margen_bruto, semaforo_utilidad_neta]

  vw_ultimo_periodo_cliente:
    route_key: vw_ultimo_periodo_cliente
    qualified_name: gold.vw_ultimo_periodo_cliente
    layer: gold
    kind: view
    description: último periodo con datos por fuente (kpis, ventas, bdp, presupuesto)
    prefer_for: [ultimo periodo, ultimo mes disponible, datos disponibles]
    customer_filter: customer_id
    time_columns: [ultimo_anio_mes, ultima_fecha]
    grain: [customer_id, fuente]
    silver_fallback: [fact_bdp, fact_venta, presupuesto_proyeccion]

  fact_bdp:
    route_key: fact_bdp
    qualified_pattern: "{schema}.fact_bdp"
    layer: silver
    kind: table
    description: balance de prueba (movimientos contables por cuenta)
    prefer_for: [balance, movimientos, saldo por cuenta, detalle contable]
    customer_filter: customer_id
    time_columns: [source_date, id_tiempo]
    time_via: gold.dim_time

  fact_venta:
    route_key: fact_venta
    qualified_pattern: "{schema}.fact_venta"
    layer: silver
    kind: table
    description: ventas / líneas de facturación (detalle por producto)
    prefer_for: [ventas por producto, mix, facturacion detallada]
    customer_filter: customer_id
    time_columns: [invoice_date, load_ts]

  fact_nota_credito:
    route_key: fact_nota_credito
    qualified_pattern: "{schema}.fact_nota_credito"
    layer: silver
    kind: table
    description: notas crédito (cabecera) para devoluciones
    prefer_for: [notas credito, devoluciones detalle]
    customer_filter: customer_id
    time_columns: [credit_note_date, invoice_date]

  presupuesto_proyeccion:
    route_key: presupuesto_proyeccion
    qualified_pattern: "{schema}.presupuesto_proyeccion"
    layer: silver
    kind: table
    description: presupuesto / proyección mensual por cuenta
    prefer_for: [presupuesto, proyeccion]
    customer_filter: customer_id
    time_columns: [anio_mes, mes]

  dim_customers:
    route_key: dim_customers
    qualified_pattern: "{schema}.dim_customers"
    layer: silver
    kind: table
    description: maestro de clientes (dimensión Siigo)
    customer_filter: none

  dim_accounts:
    route_key: dim_accounts
    qualified_pattern: "{schema}.dim_accounts"
    layer: silver
    kind: table
    description: plan de cuentas / auxiliares contables
    prefer_for: [cuentas, plan contable]
    customer_filter: customer_id

routing:
  intents: [kpis, ventas, balance, presupuesto, clientes, cuentas, mixto]
  router_order:
    - vw_fact_bdp_enriched
    - vw_dim_accounts
    - vw_kpis_financiero
    - vw_semaforos_cliente
    - vw_ventas_netas_mes
    - vw_ventas_por_producto_mes
    - vw_presupuesto_vs_real_mes
    - vw_ultimo_periodo_cliente
    - fact_bdp
    - fact_venta
    - fact_nota_credito
    - presupuesto_proyeccion
    - dim_customers
    - dim_accounts
  dim_catalog_keywords:
    - plan de cuentas
    - plan contable
    - catálogo de cuentas
    - catalogo de cuentas
    - lista de cuentas
    - cuentas contables
    - jerarquía contable
    - jerarquia contable
    - nodos del tablero
  tablero_keywords:
    - ventas
    - venta
    - facturacion
    - facturación
    - ingresos operacionales
    - ingresos
    - utilidad neta
    - utilidad bruta
    - utilidad operacional
    - utilidad
    - costo de ventas
    - costo ventas
    - gastos administrativos
    - gastos de ventas
    - gastos financieros
    - estado de resultados
    - margen bruto
    - margen neto
    - margen
    - patrimonio
    - activo
    - pasivo
    - rubro
    - tablero
  kpi_keywords:
    - kpi
    - kpis
    - roe
    - roa
    - liquidez
    - endeudamiento
    - apalancamiento
    - semaforo
    - semáforo
    - razon corriente
    - razón corriente
    - capital de trabajo
    - autonomia
    - autonomía
  ventas_netas_keywords:
    - ventas netas
    - venta neta
    - facturacion neta
    - facturación neta
    - netas por mes
    - neto por mes
  devoluciones_keywords:
    - devoluciones
    - devolución
    - devolucion
    - notas credito
    - notas crédito
    - descontar notas
    - menos notas credito
  balance_keywords:
    - balance de prueba
    - balance general
    - saldo final
    - saldos finales
    - movimientos contables
    - movimiento contable
    - detalle contable
    - mayor contable
    - fact_bdp
  presupuesto_keywords:
    - presupuesto
    - proyeccion
    - proyección
    - presupuestado
  ventas_detalle_keywords:
    - por producto
    - mix de productos
    - facturacion detallada
    - facturación detallada
    - linea de factura
    - línea de factura
    - detalle de ventas
    - top productos
    - productos mas vendidos
  presupuesto_vs_real_keywords:
    - presupuesto vs real
    - presupuesto contra real
    - cumplimiento presupuesto
    - cumplimiento del presupuesto
    - ejecucion presupuesto
    - ejecución presupuesto
    - variacion presupuesto
    - variación presupuesto
    - real vs presupuesto
  ultimo_periodo_keywords:
    - ultimo periodo
    - último periodo
    - ultimo mes disponible
    - último mes disponible
    - hasta que mes hay datos
    - periodo disponible
  semaforos_actuales_keywords:
    - semaforo actual
    - semáforo actual
    - estado de semaforos
    - estado de semáforos
    - alertas financieras
  rules:
    - Por defecto o preguntas con montos / ambiguas contables → vw_fact_bdp_enriched.
    - Catálogo de cuentas / jerarquía sin montos → vw_dim_accounts.
    - Ingresos, utilidades, costos, gastos, márgenes, patrimonio, saldos → vw_fact_bdp_enriched (SUM(mvto) sin ABS, o saldo_final).
    - Ratios pre-calculados (ROE, ROA, liquidez, endeudamiento, apalancamiento) → vw_kpis_financiero.
    - Si pregunta solo semáforos del periodo más reciente → vw_semaforos_cliente.
    - Si pregunta ventas, facturación o ingresos operacionales → vw_fact_bdp_enriched con nombre_rubro_grupo = 'Ingresos Operacionales' (SUM mvto).
    - Si pregunta devoluciones o notas crédito → vw_fact_bdp_enriched con nombre_cuenta/nombre_auxiliar ILIKE '%devoluc%' (NO fact_nota_credito).
    - vw_ventas_netas_mes solo si piden explícitamente facturación Siigo neta (bruto − notas crédito) fuera del tablero contable.
    - Si pregunta mix, top productos o ventas por producto → vw_ventas_por_producto_mes (NO fact_venta).
    - Si pregunta presupuesto vs real, cumplimiento o variación → vw_presupuesto_vs_real_mes.
    - Si pregunta último periodo/mes con datos → vw_ultimo_periodo_cliente.
    - Usa fact_venta solo si necesita líneas crudas no cubiertas por vw_ventas_por_producto_mes.
    - Usa fact_bdp solo si vw_fact_bdp_enriched no cubre el detalle granular.
    - Ventas + presupuesto en la misma pregunta → tablas mixtas.

relationships:
  - vw_fact_bdp_enriched = fact_bdp + vw_dim_accounts + dim_time (vista principal agente/tableros con montos).
  - vw_dim_accounts es catálogo/rubros por cliente (sin montos); misma lógica CASE que Power BI.
  - fact_bdp.codigo_cuenta_contable ↔ vw_dim_accounts.id_auxiliar (mismo customer_id)
  - fact_bdp.codigo_cuenta_contable ↔ dim_accounts.id_auxiliar (mismo customer_id)
  - fact_bdp.id_tiempo ↔ gold.dim_time.id_time
  - vw_ventas_netas_mes agrega fact_venta (invoice_date) y fact_nota_credito (credit_note_date)
  - vw_presupuesto_vs_real_mes agrega presupuesto_proyeccion + fact_bdp por cuenta y mes
  - vw_ventas_por_producto_mes agrega fact_venta por producto y mes
  - vw_kpis_financiero.customer_id ↔ app.customers.id (nombre_cliente conservado como atributo)
